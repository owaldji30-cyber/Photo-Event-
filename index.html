<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Event</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 10px;
      color: #ccc;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 15px;
    }

    .event {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .event h2 {
      margin-top: 0;
    }

    .album {
      display: block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .album:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <header>
    <h1>📸 PHOTO EVENT</h1>
    <p>Vos souvenirs, accessibles facilement</p>
  </header>

  <div class="container">

    <div class="event">
      <h2>💍 Mariage Jean & Marie</h2>
      <p>Album photo du mariage</p>

      <a class="album" href="https://drive.google.com/drive/folders/1LiJ6mH-0hChSuMU7xKCnnCVVfOXKGWQb" target="_blank">
  📷 Cérémonie
      </a>
      
      <a class="album" href="#">
        🎉 Réception
      </a>

      <a class="album" href="#">
        ❤️ Séance photo
      </a>
    </div>

  </div>

  
</body>
    </html>
